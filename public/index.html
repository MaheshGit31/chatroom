<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>Chatroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236c8cff'/%3E%3Cpath d='M10 14v-2a6 6 0 0 1 12 0v2' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Crect x='8' y='14' width='16' height='11' rx='3' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#0e1015;--panel:#151821;--panel2:#1b1f2b;--line:#262b3a;--text:#e7e9ee;--muted:#8b92a5;--accent:#6c8cff;--accent-d:#4f6fe0;--mine:#3a55c9;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:0 12px 40px rgba(0,0,0,.45);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f5fa;--panel:#fff;--panel2:#eef1f8;--line:#dde2ee;--text:#171a24;--muted:#667089;--accent:#4b6bf0;--accent-d:#3a56cf;--mine:#4b6bf0;--shadow:0 12px 40px rgba(20,30,60,.18);color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--accent)}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0}
h4{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label input{margin-top:5px;color:var(--text)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center}.gap{gap:10px}.gap-s{gap:4px}.end{justify-content:flex-end}.center{justify-content:center}.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:12.5px}.good{color:var(--good)}.accent{color:var(--accent)}.pad{padding:14px}.click{cursor:pointer}
.muted-i{color:var(--muted);font-style:italic}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-d)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}.btn.danger:hover{background:var(--bad);color:#fff}
.btn.small{padding:5px 11px;font-size:13px}.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;color:var(--muted);text-decoration:none}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.icon-btn.tiny{width:20px;height:20px;border-radius:6px}
.avatar{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none;user-select:none}
.avwrap{position:relative;flex:none}
.pdot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#5b6277;border:2px solid var(--panel)}.pdot.on{background:var(--good)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.badge.quiet{background:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
/* auth */
.auth-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(900px 500px at 50% -10%,rgba(108,140,255,.18),transparent)}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;margin-bottom:6px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin:14px 0}
.seg button{padding:6px 14px;border-radius:8px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--accent);color:#fff}
.seg.small{margin:0}.seg.small button{padding:3px 10px;font-size:12.5px}
.form-err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
/* shell */
.app{height:100%;display:grid;grid-template-columns:76px 340px 1fr}
.app[data-view=games],.app[data-view=alerts]{grid-template-columns:76px 1fr}
.app[data-view=games] .side,.app[data-view=alerts] .side{display:none}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rlogo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.rbtn{position:relative;width:60px;padding:8px 0 6px;border-radius:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.rbtn:hover{background:var(--panel2);color:var(--text)}.rbtn.on{background:var(--panel2);color:var(--accent)}
.rlabel{font-size:11px}
.rbtn .badge{position:absolute;top:2px;right:6px;min-width:18px;height:18px;font-size:11px}
.conn{width:10px;height:10px;border-radius:50%;margin-bottom:10px}.conn.ok{background:var(--good)}.conn.bad{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.rme{padding:0;border-radius:50%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.side-head h2{font-size:22px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--muted);margin-bottom:10px}
.searchbox input{border:0;background:none;padding:10px 0;color:var(--text)}
.side-search{margin:4px 14px 10px}
.clist{overflow:auto;flex:1;padding:0 8px 12px}
.citem{display:flex;gap:12px;padding:10px;border-radius:12px;cursor:pointer;align-items:center}
.citem:hover{background:var(--panel2)}.citem.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.cmeta{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ctitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{font-size:12px;color:var(--muted);flex:none}
.cprev{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.empty-s{text-align:center;color:var(--muted);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}.empty-s.wide{grid-column:1/-1}
.main{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column}
.empty{margin:auto;text-align:center;max-width:420px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty h2{color:var(--text);font-size:28px}
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-head .back{display:none}
.enc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--good);padding:3px 9px;border:1px solid rgba(52,211,153,.35);border-radius:20px}
.msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.daysep{text-align:center;margin:14px 0 8px}.daysep span{background:var(--panel2);color:var(--muted);font-size:12px;padding:3px 12px;border-radius:20px}
.mrow{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.mrow.first{margin-top:8px}
.mrow.mine{justify-content:flex-end}
.bubble{max-width:min(620px,78%);background:var(--panel);border:1px solid var(--line);padding:7px 11px 5px;border-radius:14px;position:relative}
.mine .bubble{background:var(--mine);border-color:transparent;color:#fff}
.mname{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:1px}
.mtext{white-space:pre-wrap;word-break:break-word}
.mine .mtext a{color:#fff}
.mmeta{display:flex;gap:8px;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted);margin-top:1px}
.mine .mmeta{color:rgba(255,255,255,.7)}
.mmeta .icon-btn{opacity:0;color:inherit}.bubble:hover .mmeta .icon-btn{opacity:1}
.seen{display:inline-flex;align-items:center;gap:2px}
.more{align-self:center;margin:6px 0}
.typing{height:20px;padding:0 20px;font-size:12.5px;color:var(--accent)}
.composer-wrap{padding:0 14px 14px;background:var(--bg)}
.cool{display:none;background:rgba(251,191,36,.14);color:var(--warn);border-radius:10px;padding:7px 12px;font-size:13px;margin-bottom:8px}.cool.on{display:block}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px}
.composer textarea{border:0;background:none;resize:none;max-height:140px;padding:9px 6px}
.send{width:42px;height:38px;padding:0;flex:none}
.gshare{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.18);border-radius:12px;padding:10px;min-width:260px}
.gshare-ic{width:44px;height:44px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.gshare-ic.sm{width:34px;height:34px;border-radius:10px}
.page{padding:20px 24px;overflow:auto;flex:1;min-height:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.page-head h2{font-size:26px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip-b{flex:none;padding:5px 12px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--muted)}.chip-b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.gcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.gtile{height:96px;display:flex;align-items:center;justify-content:center;position:relative;color:rgba(255,255,255,.92);font-size:34px;font-weight:800;text-transform:uppercase}
.live-tag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;background:var(--good);color:#04251a;padding:2px 8px;border-radius:20px;text-transform:none}
.ginfo{padding:9px 11px}.gname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ulist{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}.ulist.tall{max-height:420px}
.urow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px}.urow.click:hover{background:var(--panel2)}.urow.unread{background:rgba(108,140,255,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 12px;font-size:13px}.chip button{display:flex;color:var(--muted)}
.prof-head{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.stats{display:flex;gap:12px;margin:10px 0}.stats div{flex:1;background:var(--panel2);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center}.stats b{font-size:20px}.stats span{font-size:12px;color:var(--muted)}
.sn{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);padding:10px;border-radius:10px;letter-spacing:.04em;word-spacing:.4em;text-align:center;font-size:14px;user-select:all}
.setrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.switch{width:44px;height:26px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none;transition:.15s}.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.switch.on{background:var(--accent);border-color:var(--accent)}.switch.on i{left:20px;background:#fff}
.modal-back{position:fixed;inset:0;background:rgba(5,7,12,.6);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}.modal.wide{max-width:520px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}.modal-head h3{font-size:18px}
.modal-body{padding:6px 18px 18px;overflow:auto}
.player{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column}
.player-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.player-body{flex:1;position:relative;min-height:0}
.gframe{width:100%;height:100%;border:0;background:#000;display:block}
.gload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;color:#aaa;pointer-events:none}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #333;border-top-color:var(--accent);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;top:14px;right:14px;z-index:500;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 28px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);cursor:pointer;animation:tin .2s}.toast.error{border-left-color:var(--bad)}.toast.success{border-left-color:var(--good)}
@keyframes tin{from{transform:translateX(20px);opacity:0}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr 62px;position:relative}
  .app[data-view=games],.app[data-view=alerts]{grid-template-columns:1fr}
  .rail{grid-row:2;flex-direction:row;justify-content:space-around;padding:4px 6px;border-right:0;border-top:1px solid var(--line)}
  .rlogo,.rme,.conn,.rail .grow{display:none}
  .rbtn{width:auto;flex:1}
  .side{grid-row:1}.main{grid-row:1;display:none}
  .app.open .side{display:none}.app.open .main{display:flex}.app.open{grid-template-rows:1fr 0}.app.open .rail{display:none}
  .app[data-view=games] .main,.app[data-view=alerts] .main{display:flex}
  .app[data-view=chats]:not(.open) .main{display:none}
  .chat-head .back{display:inline-flex}.enc{display:none}
  .bubble{max-width:88%}.page{padding:14px}
}
</style>
</head>
<body>
<div id="app"><div class="auth-wrap"><div class="auth-card"><h1 class="logo">Chatroom</h1><p class="muted">Loading...</p></div></div></div>
<script>
/* ===== Chatroom client: core (helpers, crypto, state, api, realtime, data) ===== */
(() => {
'use strict';

// ---------- config ----------
// when loaded through loader.html the server url is injected as window.CHATROOM_ORIGIN
const API = String(window.CHATROOM_ORIGIN || location.origin).replace(/\/+$/, '');
const WSURL = API.replace(/^http/, 'ws') + '/ws';
const SAME_ORIGIN = API === location.origin;               // web push needs a service worker on the server's own origin

// ---------- tiny dom helpers ----------
// el('div', {class:'x', onclick: fn}, 'text', childNode) - builds nodes with textContent only (no innerHTML, so no xss)
const el = (tag, props, ...kids) => {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;                // skip empty props
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k in n) { try { n[k] = v; } catch { n.setAttribute(k, v); } }
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
};
const $ = (sel, root = document) => root.querySelector(sel);

// icons are static svg strings defined here (never user data)
const ICONS = {
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  gamepad: '<line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  sliders: '<line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="17" y2="17"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  userplus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>',
  external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  expand: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',

  if (!/^https?:/i.test(API)) return fatal('Chatroom server address is not set. Open this through loader.html or the server address.');
  let sess = null; try { sess = JSON.parse(lsGet('chatroom.session') || 'null'); } catch {}
  if (!sess || !sess.token) return showAuth('login');
  S.token = sess.token;
  try { const p = JSON.parse(lsGet('chatroom.prefs') || '{}'); Object.assign(S.prefs, p); } catch {}
  try {
    const me = await api('GET', '/api/me', null, { quiet: true });
    const priv = await idbGet('priv:' + me.user.id);
    if (!priv) { S.token = null; lsDel('chatroom.session'); return showAuth('login', 'please sign in again to unlock your keys'); }
    S.me = { ...me.user, publicKey: me.publicKey }; S.priv = priv;
    await startApp();
  } catch (e) {
    if (e.network || (e.status && e.status >= 500)) return fatal('Cannot reach the Chatroom server right now.', boot);
    S.token = null; lsDel('chatroom.session'); showAuth('login', 'session expired, please sign in');
  }
}
boot();
})();

</script>
</body>
</html>
